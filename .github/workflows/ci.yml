name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A new push to a PR cancels the previous run rather than queueing behind it.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Types, lint, tokens, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The app validates its environment at boot, so CI needs one. The
      # example file is the source of truth for which keys exist.
      - name: Create .env
        run: cp .env.example .env

      - run: pnpm check

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Create .env
        run: cp .env.example .env

      # Only chromium is used by playwright.config.ts; installing the other
      # engines would add ~600 MB to every run for nothing.
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
